# Run from frontend/: gcloud builds submit --config=../deploy/cloudbuild.frontend.yaml --substitutions=_IMAGE=REGION-docker.pkg.dev/PROJECT/REPOSITORY/otec-web,_API_URL=https://YOUR_API_URL/api
steps:
  - name: gcr.io/cloud-builders/docker
    args: [build, --build-arg, REACT_APP_API_URL=${_API_URL}, --tag, ${_IMAGE}, .]
images: [${_IMAGE}]
